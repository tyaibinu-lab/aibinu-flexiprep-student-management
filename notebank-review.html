<script>

"use strict";


/* =========================================================
   GLOBAL DATA
========================================================= */

let programmes = [];
let classes = [];


/* =========================================================
   BASIC HELPERS
========================================================= */

const $ = id => document.getElementById(id);


const esc = value =>
  String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character])
  );


function txt(value){
  return String(value ?? "").trim();
}


/* =========================================================
   SAFE JSON
========================================================= */

async function safeJson(response){

  const raw = await response.text();

  const type =
    response.headers.get("content-type") || "";

  if(
    !type.toLowerCase().includes("application/json")
  ){

    throw new Error(
      raw || `Server returned ${response.status}.`
    );

  }

  try{

    return raw
      ? JSON.parse(raw)
      : {};

  }catch{

    throw new Error(
      "Server returned invalid JSON."
    );

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function show(message,ok=true){

  const box = $("msg");

  box.className =
    message
      ? `msg ${ok ? "ok" : "err"}`
      : "";

  box.textContent =
    message || "";

}


/* =========================================================
   GENERIC FIELD READER
========================================================= */

function readField(record,names){

  if(!record) return "";

  for(const name of names){

    if(
      record[name] !== undefined &&
      record[name] !== null &&
      txt(record[name])
    ){

      return record[name];

    }

  }

  return "";

}


/* =========================================================
   GET NOTE VALUE
========================================================= */

function value(note,...keys){

  for(const key of keys){

    if(
      note?.[key] !== undefined &&
      note?.[key] !== null &&
      txt(note[key])
    ){

      return note[key];

    }

  }

  return "";

}


/* =========================================================
   NOTE SECTION
========================================================= */

function section(label,content){

  content = txt(content);

  if(!content){
    return "";
  }

  return `
    <div class="section">

      <h3>${esc(label)}</h3>

      <div class="content">
        ${esc(content)}
      </div>

    </div>
  `;

}


/* =========================================================
   RENDER NOTE
========================================================= */

function renderNote(note){

  return `

    <div class="note-body">

      ${section(
        "Learning Objectives",
        value(note,"Learning Objectives")
      )}

      ${section(
        "Key Terms",
        value(note,"Key Terms")
      )}

      ${section(
        "Main Content",
        value(note,"Content")
      )}

      ${section(
        "Examples",
        value(note,"Examples")
      )}

      ${section(
        "Worked Examples",
        value(note,"Worked Examples")
      )}

      ${section(
        "Formulae",
        value(note,"Formulae")
      )}

      ${section(
        "Applications",
        value(note,"Applications")
      )}

      ${section(
        "Common Misconceptions",
        value(note,"Common Misconceptions")
      )}

      ${section(
        "Summary",
        value(note,"Summary")
      )}

      ${section(
        "Examination Tips",
        value(note,"Exam Tips")
      )}

      ${section(
        "WAEC Focus",
        value(note,"WAEC Focus")
      )}

      ${section(
        "NECO Focus",
        value(note,"NECO Focus")
      )}

      ${section(
        "UTME Focus",
        value(note,"UTME Focus")
      )}

      ${section(
        "Diagrams",
        value(note,"Diagrams")
      )}

    </div>

  `;

}


/* =========================================================
   AIRTABLE RECORD ID
========================================================= */

function recordId(record){

  const raw = readField(
    record,
    [
      "airtableId",
      "airtableID",
      "recordId",
      "recordID",
      "id",
      "ID"
    ]
  );

  if(
    typeof raw === "string" &&
    raw.includes("|")
  ){

    const parts =
      raw.split("|");

    return parts[parts.length-1];

  }

  return txt(raw);

}


/* =========================================================
   PROGRAMME NAME
========================================================= */

function programmeName(record){

  /*
   * Handles several possible API/Airtable field names.
   */

  return txt(
    readField(
      record,
      [
        "name",
        "Name",
        "programme",
        "Programme",
        "programmeName",
        "Programme Name",
        "Programme_Name",
        "code",
        "Code"
      ]
    )
  );

}


/* =========================================================
   CLASS NAME
========================================================= */

function className(record){

  /*
   * Handles several possible API/Airtable field names.
   */

  return txt(
    readField(
      record,
      [
        "name",
        "Name",
        "className",
        "Class Name",
        "Class_Name",
        "class",
        "Class",
        "level",
        "Level"
      ]
    )
  );

}


/* =========================================================
   NORMALISE PROGRAMME
========================================================= */

function normaliseProgramme(value){

  const v =
    txt(value)
      .toUpperCase();

  if(v.includes("WAEC"))
    return "WAEC";

  if(v.includes("NECO"))
    return "NECO";

  if(v.includes("UTME") || v.includes("JAMB"))
    return "UTME";

  return txt(value);

}


/* =========================================================
   NORMALISE CLASS
========================================================= */

function normaliseClass(value){

  const v =
    txt(value)
      .toUpperCase();

  /*
   * Extract SS1, SS2, SS3 etc.
   */

  const match =
    v.match(/\bSS\s*[123]\b/);

  if(match){

    return match[0]
      .replace(/\s+/g,"");

  }

  return txt(value);

}


/* =========================================================
   PROGRAMME OPTIONS
========================================================= */

function programmeOptions(
  selectedProgramme=""
){

  const selected =
    normaliseProgramme(
      selectedProgramme
    );


  return `

    <option value="">
      Select target programme
    </option>

    ${programmes.map(programme => {

      const name =
        normaliseProgramme(
          programmeName(programme)
        );

      if(!name) return "";

      return `
        <option
          value="${esc(name)}"
          ${
            name === selected
              ? "selected"
              : ""
          }>

          ${esc(name)}

        </option>
      `;

    }).join("")}

  `;

}


/* =========================================================
   CLASS OPTIONS
========================================================= */

function classOptions(
  selectedProgramme="",
  selectedClass=""
){

  const programme =
    normaliseProgramme(
      selectedProgramme
    );


  /*
   * Programme must be selected first.
   */

  if(!programme){

    return `
      <option value="">
        Select target programme first
      </option>
    `;

  }


  /*
   * IMPORTANT:
   *
   * DO NOT FILTER CLASSES BY PROGRAMME.
   *
   * SS1, SS2 and SS3 are shared academic
   * publication levels.
   */

  const available =
    classes;


  /*
   * Remove duplicate class names while
   * retaining the first actual Airtable ID.
   */

  const seen =
    new Set();


  const unique =
    available.filter(record => {

      const name =
        normaliseClass(
          className(record)
        );

      const key =
        name.toUpperCase();


      if(!name || seen.has(key)){
        return false;
      }


      seen.add(key);

      return true;

    });


  /*
   * Sort SS1 → SS2 → SS3.
   */

  unique.sort((a,b) => {

    const aa =
      normaliseClass(
        className(a)
      );

    const bb =
      normaliseClass(
        className(b)
      );


    const na =
      parseInt(
        aa.replace(/\D/g,"")
      ) || 999;

    const nb =
      parseInt(
        bb.replace(/\D/g,"")
      ) || 999;


    return na - nb;

  });


  const options =
    unique.map(record => {

      const id =
        recordId(record);

      const name =
        normaliseClass(
          className(record)
        );


      return `
        <option
          value="${esc(id)}"
          ${
            id === selectedClass
              ? "selected"
              : ""
          }>

          ${esc(name)}

        </option>
      `;

    }).join("");


  return `

    <option value="">
      ${
        unique.length
          ? "Select target class"
          : "No classes available"
      }
    </option>

    ${options}

  `;

}


/* =========================================================
   CLASS SELECT STATE
========================================================= */

function setClassState(
  select,
  programme,
  selectedClass=""
){

  if(!select){
    return;
  }


  const p =
    normaliseProgramme(
      programme
    );


  if(!p){

    select.disabled = true;

    select.innerHTML = `
      <option value="">
        Select target programme first
      </option>
    `;

    return;

  }


  select.disabled = false;


  select.innerHTML =
    classOptions(
      p,
      selectedClass
    );

}


/* =========================================================
   REFRESH CLASSES
========================================================= */

function refreshClasses(index){

  const programmeSelect =
    $("programme_" + index);

  const classSelect =
    $("class_" + index);


  if(
    programmeSelect &&
    classSelect
  ){

    setClassState(
      classSelect,
      programmeSelect.value
    );

  }

}


/* =========================================================
   RENDER REVIEW CARD
========================================================= */

function renderCard(note,index){

  const id =
    note.airtableId ||
    note["Note ID"] ||
    note.id;


  const title =
    value(note,"Title") ||
    "Untitled Note";


  const subject =
    value(note,"Subject");


  const version =
    value(note,"Version") ||
    "1";


  const updated =
    value(
      note,
      "Updated Date",
      "Created Date"
    );


  const commentId =
    `comment_${index}`;


  const programmeId =
    `programme_${index}`;


  const classIdElement =
    `class_${index}`;


  return `

    <article
      class="card"
      id="note_${index}">

      <h2>
        ${esc(title)}
      </h2>


      <div class="meta">

        ${
          subject
            ? `
              <span class="badge">
                ${esc(subject)}
              </span>
            `
            : ""
        }

        <span class="badge">
          Under Review
        </span>

        <span class="badge">
          Version ${esc(version)}
        </span>

      </div>


      ${
        updated
          ? `
            <div class="small">
              Last updated:
              ${esc(updated)}
            </div>
          `
          : ""
      }


      <details>

        <summary>
          📖 Read Full Note
        </summary>

        ${renderNote(note)}

      </details>


      <div class="target-box">

        <b>
          Publication Target
        </b>


        <div
          class="small"
          style="margin-top:4px">

          Select the programme first.
          Target Class will then load all available
          academic classes.

          The selected programme and class are stored
          in <b>NoteBank_Publications</b>.

        </div>


        <div class="target-grid">


          <div class="field">

            <label
              for="${programmeId}">

              Target Programme

            </label>


            <select
              id="${programmeId}"
              onchange="refreshClasses(${index})">

              ${programmeOptions()}

            </select>

          </div>


          <div class="field">

            <label
              for="${classIdElement}">

              Target Class

            </label>


            <select
              id="${classIdElement}"
              disabled>

              <option value="">
                Select target programme first
              </option>

            </select>

          </div>


        </div>

      </div>


      <div class="comment">

        <label
          for="${commentId}">

          <b>
            Reviewer Comment
          </b>

        </label>


        <textarea
          id="${commentId}"
          placeholder="Add a review comment. Required when requesting changes.">
        </textarea>

      </div>


      <div class="actions">

        <button
          class="secondary"
          type="button"
          onclick="requestChanges(
            '${esc(id)}',
            '${commentId}'
          )">

          ✏️ Request Changes

        </button>


        <button
          class="primary"
          type="button"
          onclick="approveNote(
            '${esc(id)}',
            '${commentId}',
            '${programmeId}',
            '${classIdElement}'
          )">

          ✓ Approve & Publish

        </button>

      </div>

    </article>

  `;

}


/* =========================================================
   LOAD ACADEMIC DATA
========================================================= */

async function loadAcademicTargets(){

  const response =
    await fetch(
      "/api/academic",
      {
        cache:"no-store"
      }
    );


  const data =
    await safeJson(response);


  if(!response.ok){

    throw new Error(
      data.error ||
      "Unable to load academic data."
    );

  }


  const records =
    Array.isArray(data.records)
      ? data.records
      : [];


  console.log(
    "ACADEMIC API RECORDS:",
    records
  );


  /* =====================================================
     PROGRAMMES
  ===================================================== */

  const programmeMap =
    new Map();


  /*
   * First inspect records explicitly marked
   * as programmes.
   */

  records.forEach(record => {

    const type =
      txt(
        readField(
          record,
          [
            "type",
            "Type",
            "recordType",
            "Record Type"
          ]
        )
      ).toLowerCase();


    const name =
      normaliseProgramme(
        programmeName(record)
      );


    if(
      type === "programme" ||
      type === "program"
    ){

      if(name){

        programmeMap.set(
          name,
          record
        );

      }

    }

  });


  /*
   * Also inspect programme fields directly.
   */

  records.forEach(record => {

    const possible =
      normaliseProgramme(
        readField(
          record,
          [
            "programme",
            "Programme",
            "programmeName",
            "Programme Name",
            "Programme_Name"
          ]
        )
      );


    if(
      ["WAEC","NECO","UTME"].includes(possible)
    ){

      programmeMap.set(
        possible,
        {
          ...record,
          name:possible
        }
      );

    }

  });


  /*
   * GUARANTEE the three supported examination
   * programmes.
   *
   * This prevents a missing Type field in Airtable
   * from making a programme disappear.
   */

  for(
    const name of [
      "WAEC",
      "NECO",
      "UTME"
    ]
  ){

    if(!programmeMap.has(name)){

      programmeMap.set(
        name,
        {
          name,
          programme:name,
          type:"Programme"
        }
      );

    }

  }


  programmes =
    Array.from(
      programmeMap.values()
    );


  /*
   * Fixed display order.
   */

  const programmeOrder = {
    WAEC:1,
    NECO:2,
    UTME:3
  };


  programmes.sort(
    (a,b) =>
      (programmeOrder[
        normaliseProgramme(
          programmeName(a)
        )
      ] || 99)
      -
      (programmeOrder[
        normaliseProgramme(
          programmeName(b)
        )
      ] || 99)
  );


  /* =====================================================
     CLASSES
  ===================================================== */

  const classMap =
    new Map();


  records.forEach(record => {

    const name =
      normaliseClass(
        className(record)
      );


    /*
     * Recognise SS1, SS2, SS3 regardless of
     * whether the API calls the record a class.
     */

    if(
      /^SS[1-3]$/i.test(name)
    ){

      const id =
        recordId(record);


      /*
       * Only use records with an actual Airtable
       * record ID.
       */

      if(id){

        classMap.set(
          name.toUpperCase(),
          {
            ...record,
            name,
            airtableId:id
          }
        );

      }

    }

  });


  classes =
    Array.from(
      classMap.values()
    );


  /*
   * Sort SS1 → SS2 → SS3.
   */

  classes.sort((a,b) => {

    const aa =
      parseInt(
        className(a).replace(/\D/g,"")
      ) || 99;

    const bb =
      parseInt(
        className(b).replace(/\D/g,"")
      ) || 99;

    return aa - bb;

  });


  console.log(
    "PROGRAMMES:",
    programmes
  );

  console.log(
    "CLASSES:",
    classes
  );


  /*
   * IMPORTANT DEBUG INFORMATION.
   */

  show(
    `Academic targets loaded: ${programmes.length} programmes, ${classes.length} classes.`,
    true
  );

}


/* =========================================================
   LOAD REVIEW QUEUE
========================================================= */

async function loadQueue(){

  $("queue").innerHTML = `
    <div class="empty">
      Loading programmes and classes...
    </div>
  `;


  $("queueCount")
    .textContent = "0";


  show("");


  try{


    /*
     * FIRST:
     * Load Academic targets.
     */

    await loadAcademicTargets();


    /*
     * SECOND:
     * Load review queue.
     */

    const response =
      await fetch(
        "/api/note-reviews?list=review",
        {
          cache:"no-store"
        }
      );


    const data =
      await safeJson(response);


    if(
      !response.ok ||
      data.success !== true
    ){

      throw new Error(
        data.error ||
        "Unable to load review queue."
      );

    }


    const notes =
      Array.isArray(data.notes)
        ? data.notes
        : [];


    $("queueCount")
      .textContent =
        notes.length;


    if(!notes.length){

      $("queue").innerHTML = `
        <div class="empty">
          🎉 No notes are currently awaiting approval.
        </div>
      `;

      return;

    }


    $("queue").innerHTML =
      notes
        .map(renderCard)
        .join("");


  }catch(error){

    console.error(error);


    $("queue").innerHTML = `
      <div class="empty">
        ❌ ${esc(error.message)}
      </div>
    `;


    show(
      error.message,
      false
    );

  }

}


/* =========================================================
   REVIEW ACTION
========================================================= */

async function reviewAction(
  noteId,
  commentId,
  action,
  programmeId,
  classId
){

  const reviewer =
    txt(
      $("reviewerName").value
    );


  const comment =
    txt(
      $(commentId)?.value
    );


  if(!reviewer){

    show(
      "Enter the reviewer name first.",
      false
    );

    $("reviewerName").focus();

    return;

  }


  if(
    action === "request_changes" &&
    !comment
  ){

    show(
      "Reviewer comment is required when requesting changes.",
      false
    );

    $(commentId).focus();

    return;

  }


  let targetProgramme = "";
  let targetClass = "";


  if(action === "approve"){

    targetProgramme =
      normaliseProgramme(
        $(programmeId)?.value
      );


    targetClass =
      txt(
        $(classId)?.value
      );


    if(!targetProgramme){

      show(
        "Select the Target Programme before publishing.",
        false
      );

      return;

    }


    if(!targetClass){

      show(
        "Select the Target Class before publishing.",
        false
      );

      return;

    }

  }


  const button =
    document.activeElement;


  if(button){
    button.disabled = true;
  }


  try{

    const response =
      await fetch(
        "/api/note-reviews",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            noteId,

            action,

            reviewer,

            reviewerComment:
              comment,

            targetProgramme,

            targetClass

          })

        }
      );


    const data =
      await safeJson(response);


    if(
      !response.ok ||
      data.success !== true
    ){

      throw new Error(
        data.error ||
        "Review operation failed."
      );

    }


    show(
      data.message ||
      "Review completed successfully.",
      true
    );


    await loadQueue();


  }catch(error){

    console.error(error);


    show(
      error.message,
      false
    );


  }finally{

    if(button){
      button.disabled = false;
    }

  }

}


/* =========================================================
   APPROVE
========================================================= */

function approveNote(
  noteId,
  commentId,
  programmeId,
  classId
){

  if(
    !confirm(
      "Approve this note and publish it to the selected programme and class?"
    )
  ){

    return;

  }


  reviewAction(
    noteId,
    commentId,
    "approve",
    programmeId,
    classId
  );

}


/* =========================================================
   REQUEST CHANGES
========================================================= */

function requestChanges(
  noteId,
  commentId
){

  reviewAction(
    noteId,
    commentId,
    "request_changes"
  );

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadQueue();

</script>
