<script>

let records = [];
let currentType = "All";
let editing = null;

let currentAIType = null;
let currentAIPayload = null;
let currentAIResult = null;


/* =====================================================
   BASIC HELPERS
   ===================================================== */

const $ = id =>
  document.getElementById(id);


const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])
  );


function safeJson(response) {

  const contentType =
    response.headers.get("content-type") || "";

  if (
    !contentType
      .toLowerCase()
      .includes("application/json")
  ) {

    return response.text().then(text => {

      throw new Error(
        `Server returned non-JSON response (${response.status}).`
      );

    });

  }

  return response.json();

}


/* =====================================================
   CLEAN ACADEMIC RECORDS
   ===================================================== */

function cleanRecords(data) {

  return (Array.isArray(data) ? data : [])
    .filter(r => {

      if (!r || !r.type)
        return false;

      if (
        r.type !== "Assignment" &&
        !String(r.name || "").trim()
      )
        return false;

      if (
        r.type === "Assignment" &&
        (
          !String(r.className || "").trim() ||
          !String(r.subject || "").trim() ||
          !String(r.teacher || "").trim()
        )
      )
        return false;

      return true;

    });

}


/* =====================================================
   DISPLAY NAME
   ===================================================== */

function displayName(r) {

  if (r.type === "Assignment") {

    return [
      r.className,
      r.subject,
      r.teacher
    ]
      .filter(Boolean)
      .join(" — ");

  }

  return r.name || "";

}


/* =====================================================
   LOAD ACADEMIC DATA
   ===================================================== */

async function loadData() {

  try {

    const r =
      await fetch(
        "/api/academic",
        {
          cache: "no-store"
        }
      );

    const d =
      await safeJson(r);

    if (!r.ok) {

      throw new Error(
        d.error?.message ||
        d.error ||
        "Unable to load records"
      );

    }

    records =
      cleanRecords(
        d.records || []
      );

    populate();
    render();

    show("", true);

  }
  catch (e) {

    console.error(
      "ACADEMIC LOAD ERROR:",
      e
    );

    show(
      e.message ||
      "Unable to load academic records.",
      false
    );

  }

}


/* =====================================================
   UNIQUE RECORDS
   ===================================================== */

function unique(type) {

  const seen = new Set();

  return records

    .filter(r =>
      r.type === type &&
      r.status !== "Inactive" &&
      String(r.name || "").trim()
    )

    .filter(r => {

      const k =
        r.name
          .trim()
          .toLowerCase();

      if (seen.has(k))
        return false;

      seen.add(k);

      return true;

    })

    .sort(
      (a, b) =>
        a.name.localeCompare(b.name)
    );

}


/* =====================================================
   FILL SELECT
   ===================================================== */

function fill(
  id,
  type,
  placeholder
) {

  const e = $(id);

  if (!e)
    return;

  e.innerHTML =
    "<option value=''>" +
    placeholder +
    "</option>" +

    unique(type)
      .map(r =>
        "<option value='" +
        esc(r.name) +
        "'>" +
        esc(r.name) +
        "</option>"
      )
      .join("");

}


/* =====================================================
   POPULATE ACADEMIC SELECTS
   ===================================================== */

function populate() {

  fill(
    "programme",
    "Programme",
    "Select programme"
  );

  fill(
    "className",
    "Class",
    "Select class"
  );

  fill(
    "subject",
    "Subject",
    "Select subject"
  );

  fill(
    "teacher",
    "Teacher",
    "Select teacher"
  );

}


/* =====================================================
   SEARCH
   ===================================================== */

function matchesSearch(r, q) {

  if (!q)
    return true;

  return `
    ${r.type || ""}
    ${r.name || ""}
    ${r.code || ""}
    ${r.programme || ""}
    ${r.className || ""}
    ${r.subject || ""}
    ${r.teacher || ""}
  `
    .toLowerCase()
    .includes(q);

}


function filteredRecords() {

  const q =
    $("search")
      .value
      .toLowerCase()
      .trim();

  return records.filter(
    r =>
      (
        currentType === "All" ||
        r.type === currentType
      ) &&
      matchesSearch(r, q)
  );

}


/* =====================================================
   RENDER ACADEMIC RECORDS
   ===================================================== */

function render() {

  [
    "Programme",
    "Class",
    "Subject",
    "Teacher",
    "Assignment"
  ]
    .forEach(t => {

      const valid =
        records.filter(
          r => r.type === t
        );

      const element =
        $("count" + t);

      if (element) {

        element.textContent =
          valid.length;

      }

    });


  if (currentType === "NoteBank")
    return;


  const data =
    filteredRecords();


  $("rows").innerHTML =
    data
      .map(r => `

        <tr>

          <td>${esc(r.type)}</td>

          <td>
            <b>${esc(displayName(r))}</b>
          </td>

          <td>${esc(r.code)}</td>

          <td>${esc(r.programme)}</td>

          <td>${esc(r.className)}</td>

          <td>${esc(r.subject)}</td>

          <td>${esc(r.teacher)}</td>

          <td>
            <span class="badge">
              ${esc(r.status || "Active")}
            </span>
          </td>

          <td>

            <button
              type="button"
              class="secondary"
              onclick="editRecord('${esc(r.airtableId)}')">

              Edit

            </button>

          </td>

        </tr>

      `)
      .join("")

    ||

    `
      <tr>
        <td colspan="9" class="empty">
          No academic records found.
        </td>
      </tr>
    `;


  $("mobileRecords").innerHTML =
    data
      .map(r => `

        <div class="record-card">

          <div class="record-title">
            ${esc(displayName(r))}
          </div>

          <div class="record-grid">

            <div class="record-field">
              <small>Type</small>
              <div>${esc(r.type)}</div>
            </div>

            <div class="record-field">
              <small>Code</small>
              <div>${esc(r.code)}</div>
            </div>

            <div class="record-field">
              <small>Programme</small>
              <div>${esc(r.programme)}</div>
            </div>

            <div class="record-field">
              <small>Class</small>
              <div>${esc(r.className)}</div>
            </div>

            <div class="record-field">
              <small>Subject</small>
              <div>${esc(r.subject)}</div>
            </div>

            <div class="record-field">
              <small>Teacher</small>
              <div>${esc(r.teacher)}</div>
            </div>

          </div>

          <div class="record-action">

            <button
              type="button"
              class="secondary"
              onclick="editRecord('${esc(r.airtableId)}')">

              Edit

            </button>

          </div>

        </div>

      `)
      .join("");

}


/* =====================================================
   FORM TYPE TOGGLE
   ===================================================== */

function toggle() {

  const t =
    $("type").value;

  const assignment =
    t === "Assignment";


  $("nameWrap").style.display =
    assignment
      ? "none"
      : "block";


  $("codeWrap").style.display =
    (
      t === "Programme" ||
      t === "Subject"
    )
      ? "block"
      : "none";


  [
    "programmeWrap",
    "classWrap",
    "subjectWrap",
    "teacherWrap"
  ]
    .forEach(x => {

      $(x).style.display =
        assignment
          ? "block"
          : "none";

    });


  $("name").required =
    !assignment;

  $("className").required =
    assignment;

  $("subject").required =
    assignment;

  $("teacher").required =
    assignment;


  $("nameLabel").textContent =
    t;

}


/* =====================================================
   OPEN FORM
   ===================================================== */

function openForm(r = null) {

  editing = r;

  $("formTitle").textContent =
    r
      ? "Edit Academic Record"
      : "Add Academic Record";

  $("formMsg").textContent = "";

  $("academicForm").reset();


  if (r) {

    $("type").value =
      r.type;

    $("name").value =
      r.name || "";

    $("code").value =
      r.code || "";

    $("programme").value =
      r.programme || "";

    $("className").value =
      r.className || "";

    $("subject").value =
      r.subject || "";

    $("teacher").value =
      r.teacher || "";

    $("status").value =
      r.status || "Active";

    $("notes").value =
      r.notes || "";

  }


  toggle();

  $("modal")
    .classList
    .add("show");

}


/* =====================================================
   CLOSE FORM
   ===================================================== */

function closeForm() {

  $("modal")
    .classList
    .remove("show");

  editing = null;

}


/* =====================================================
   EDIT RECORD
   ===================================================== */

function editRecord(id) {

  const r =
    records.find(
      x =>
        x.airtableId === id
    );

  if (r)
    openForm(r);

}


/* =====================================================
   MESSAGE
   ===================================================== */

function show(t, ok) {

  const m =
    $("msg");

  m.className =
    t
      ? "msg " + (ok ? "ok" : "err")
      : "msg";

  m.textContent =
    t;

}


/* =====================================================
   MAIN TAB HANDLER
   ===================================================== */

$("tabs")
  .addEventListener(
    "click",
    function(e) {

      const button =
        e.target.closest(
          "[data-type]"
        );

      if (!button)
        return;

      e.preventDefault();

      currentType =
        button.dataset.type;


      document
        .querySelectorAll(
          "#tabs [data-type]"
        )
        .forEach(
          x =>
            x.classList.remove(
              "active"
            )
        );


      button.classList.add(
        "active"
      );


      if (
        currentType ===
        "NoteBank"
      ) {

        $("academicRecords")
          .style
          .display = "none";

        $("noteBank")
          .classList
          .add("active");

      }
      else {

        $("academicRecords")
          .style
          .display = "block";

        $("noteBank")
          .classList
          .remove("active");

        render();

      }

    }
  );


/* =====================================================
   AI TOOL SWITCHER
   ===================================================== */

function showAITool(type) {

  const note =
    $("noteCreator");

  const question =
    $("questionCreator");

  const noteTab =
    $("noteCreatorTab");

  const questionTab =
    $("questionCreatorTab");


  if (type === "note") {

    note
      .classList
      .add("active");

    question
      .classList
      .remove("active");

    noteTab
      .classList
      .add("active");

    questionTab
      .classList
      .remove("active");

  }
  else {

    note
      .classList
      .remove("active");

    question
      .classList
      .add("active");

    noteTab
      .classList
      .remove("active");

    questionTab
      .classList
      .add("active");

  }

}


/* =====================================================
   EXAMINATION CHECKBOXES
   IMPORTANT:
   These selectors match the actual HTML classes.
   ===================================================== */

function getNoteExamTypes() {

  return [
    ...document.querySelectorAll(
      ".noteExam:checked"
    )
  ]
    .map(cb => cb.value)
    .filter(Boolean);

}


function getQuestionExamTypes() {

  return [
    ...document.querySelectorAll(
      ".questionExam:checked"
    )
  ]
    .map(cb => cb.value)
    .filter(Boolean);

}


/* =====================================================
   BUILD NOTE PROMPT
   ===================================================== */

function buildNotePrompt() {

  const subject =
    $("aiNoteSubject")
      .value
      .trim();

  const cls =
    $("aiNoteClass")
      .value
      .trim();

  const programme =
    $("aiNoteProgramme")
      .value
      .trim();

  const topic =
    $("aiNoteTopic")
      .value
      .trim();

  const teacherPrompt =
    $("aiNotePrompt")
      .value
      .trim();

  const exams =
    getNoteExamTypes();


  if (
    !subject ||
    !cls ||
    !topic ||
    !teacherPrompt
  ) {

    throw new Error(
      "Select Subject, Class, Topic and enter the teacher prompt."
    );

  }


  return {

    contentType: "Note",

    subject,

    className: cls,

    programme,

    topic,

    examTypes:
      exams.length
        ? exams
        : [
            "WAEC",
            "NECO",
            "UTME"
          ],

    teacherPrompt,

    systemContext: `
Create academic content for Aibinu Flexiprep Educonsult.

Subject: ${subject}
Class: ${cls}
Programme: ${programme || "General"}
Topic: ${topic}
Examination focus: ${
      exams.length
        ? exams.join(", ")
        : "WAEC, NECO, UTME"
    }

The teacher's prompt is the primary instruction.

Content must be suitable for the selected academic level and examination context.

Do not publish the content.
Return it as a teacher-review draft.
`

  };

}


/* =====================================================
   BUILD QUESTION PROMPT
   ===================================================== */

function buildQuestionPrompt() {

  const subject =
    $("aiQuestionSubject")
      .value
      .trim();

  const cls =
    $("aiQuestionClass")
      .value
      .trim();

  const programme =
    $("aiQuestionProgramme")
      .value
      .trim();

  const topic =
    $("aiQuestionTopic")
      .value
      .trim();

  let count =
    Number(
      $("aiQuestionCount")
        .value
    );


  if (!Number.isFinite(count))
    count = 1;


  count =
    Math.max(
      1,
      Math.min(
        100,
        Math.floor(count)
      )
    );


  const difficulty =
    $("aiQuestionDifficulty")
      .value ||
    "Mixed";

  const bloomLevel =
    $("aiQuestionBloom")
      .value ||
    "Mixed";

  const questionType =
    $("aiQuestionType")
      .value ||
    "MCQ";

  const teacherPrompt =
    $("aiQuestionPrompt")
      .value
      .trim();

  const exams =
    getQuestionExamTypes();


  if (
    !subject ||
    !cls ||
    !topic ||
    !teacherPrompt
  ) {

    throw new Error(
      "Select Subject, Class, Topic and enter the teacher prompt."
    );

  }


  return {

    contentType: "Question",

    subject,

    className: cls,

    programme,

    topic,

    examTypes:
      exams.length
        ? exams
        : [
            "WAEC",
            "NECO",
            "UTME"
          ],

    questionCount:
      count,

    difficulty,

    bloomLevel,

    questionType,

    teacherPrompt,

    systemContext: `
Create examination-style questions for Aibinu Flexiprep Educonsult.

Subject: ${subject}
Class: ${cls}
Programme: ${programme || "General"}
Topic: ${topic}
Exam types: ${
      exams.length
        ? exams.join(", ")
        : "WAEC, NECO, UTME"
    }
Number of questions: ${count}
Difficulty: ${difficulty}
Bloom level: ${bloomLevel}
Question type: ${questionType}

The teacher's prompt is the primary instruction.

Generate exactly ${count} question${
      count === 1 ? "" : "s"
    } where possible.

For MCQ questions provide:
- question
- optionA
- optionB
- optionC
- optionD
- correctAnswer
- difficulty
- bloomLevel
- explanation

Use accurate calculations and plausible distractors.

Return structured questions suitable for teacher review.

Do not approve or publish the questions.
`

  };

}


/* =====================================================
   GENERATE NOTE DRAFT
   ===================================================== */

async function generateNoteDraft() {

  let payload;


  try {

    payload =
      buildNotePrompt();

  }
  catch (error) {

    alert(
      error.message
    );

    return;

  }


  currentAIType =
    "note";

  currentAIPayload =
    payload;


  const resultBox =
    $("noteAIResult");

  const preview =
    $("notePromptPreview");


  if (resultBox) {

    resultBox
      .classList
      .add("show");

  }


  if (preview) {

    preview.textContent =
      "⏳ Generating note with AI...";

  }


  try {

    const response =
      await fetch(
        "/api/ai-content",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const data =
      await safeJson(
        response
      );


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.details ||
        `Server error: ${response.status}`
      );

    }


    if (!data.success) {

      throw new Error(
        data.error ||
        "AI note generation failed."
      );

    }


    const note =
      data.note;


    if (!note) {

      throw new Error(
        "The AI returned no note."
      );

    }


    currentAIResult = {

      type: "Note",

      note,

      raw: data

    };


    if (preview) {

      preview.textContent =

        `TITLE\n\n` +

        `${note.title || ""}\n\n` +

        `LEARNING OBJECTIVES\n\n` +

        `${note.learningObjectives || ""}\n\n` +

        `KEY TERMS\n\n` +

        `${note.keyTerms || ""}\n\n` +

        `CONTENT\n\n` +

        `${note.content || ""}\n\n` +

        `EXAMPLES\n\n` +

        `${note.examples || ""}\n\n` +

        `WORKED EXAMPLES\n\n` +

        `${note.workedExamples || ""}\n\n` +

        `SUMMARY\n\n` +

        `${note.summary || ""}\n\n` +

        `EXAMINATION TIPS\n\n` +

        `${note.examTips || ""}\n\n` +

        `WAEC FOCUS\n\n` +

        `${note.waecFocus || ""}\n\n` +

        `NECO FOCUS\n\n` +

        `${note.necoFocus || ""}\n\n` +

        `UTME FOCUS\n\n` +

        `${note.utmeFocus || ""}`;

    }


    alert(
      "AI note generated successfully as DRAFT."
    );

  }
  catch (error) {

    console.error(
      "AI NOTE ERROR:",
      error
    );


    currentAIResult =
      null;


    if (preview) {

      preview.textContent =
        `❌ Generation failed:\n\n${error.message}`;

    }


    alert(
      `Note generation failed:\n\n${error.message}`
    );

  }

}


/* =====================================================
   GENERATE QUESTION DRAFT
   ===================================================== */

async function generateQuestionDraft() {

  let payload;


  try {

    payload =
      buildQuestionPrompt();

  }
  catch (error) {

    alert(
      error.message
    );

    return;

  }


  currentAIType =
    "question";

  currentAIPayload =
    payload;


  const resultBox =
    $("questionAIResult");

  const preview =
    $("questionPromptPreview");


  if (resultBox) {

    resultBox
      .classList
      .add("show");

  }


  if (preview) {

    preview.textContent =
      "⏳ Generating questions with AI...";

  }


  try {

    const response =
      await fetch(
        "/api/ai-content",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const data =
      await safeJson(
        response
      );


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.details ||
        `Server error: ${response.status}`
      );

    }


    if (!data.success) {

      throw new Error(
        data.error ||
        "AI question generation failed."
      );

    }


    const questions =
      Array.isArray(
        data.questions
      )
        ? data.questions
        : [];


    if (!questions.length) {

      throw new Error(
        "The AI returned no questions."
      );

    }


    currentAIResult = {

      type: "Question",

      questions,

      raw: data

    };


    if (preview) {

      preview.textContent =
        questions
          .map(
            (q, index) => {

              return (

                `QUESTION ${index + 1}\n\n` +

                `${q.question || ""}\n\n` +

                `A. ${q.optionA || ""}\n` +

                `B. ${q.optionB || ""}\n` +

                `C. ${q.optionC || ""}\n` +

                `D. ${q.optionD || ""}\n\n` +

                `Correct Answer: ${
                  q.correctAnswer || ""
                }\n` +

                `Difficulty: ${
                  q.difficulty || payload.difficulty
                }\n` +

                `Bloom Level: ${
                  q.bloomLevel || payload.bloomLevel
                }\n\n` +

                `Explanation: ${
                  q.explanation || ""
                }\n\n` +

                `${"─".repeat(50)}\n\n`

              );

            }
          )
          .join("");

    }


    alert(
      `${questions.length} AI question${
        questions.length === 1
          ? ""
          : "s"
      } generated successfully as DRAFT.`
    );

  }
  catch (error) {

    console.error(
      "AI QUESTION ERROR:",
      error
    );


    currentAIResult =
      null;


    if (preview) {

      preview.textContent =
        `❌ Generation failed:\n\n${error.message}`;

    }


    alert(
      `Question generation failed:\n\n${error.message}`
    );

  }

}


/* =====================================================
   EDIT NOTE DRAFT
   ===================================================== */

function editNoteDraft() {

  $("aiNotePrompt")
    .focus();

  show(
    "Edit the teacher prompt and generate again when ready.",
    true
  );

}


/* =====================================================
   EDIT QUESTION DRAFT
   ===================================================== */

function editQuestionDraft() {

  $("aiQuestionPrompt")
    .focus();

  show(
    "Edit the teacher prompt and generate again when ready.",
    true
  );

}


/* =====================================================
   APPROVAL WORKFLOW
   KEEPING CURRENT WORKING BEHAVIOUR
   ===================================================== */

function submitNoteForApproval() {

  if (
    !currentAIResult ||
    currentAIResult.type !== "Note"
  ) {

    show(
      "Generate a note draft first.",
      false
    );

    return;

  }


  show(
    "Note draft is ready for the secure NoteBank approval workflow.",
    true
  );

}


/* =====================================================
   QUESTION APPROVAL
   ===================================================== */

function submitQuestionsForApproval() {

  if (
    !currentAIResult ||
    currentAIResult.type !== "Question"
  ) {

    show(
      "Generate questions first.",
      false
    );

    return;

  }


  show(
    "Question draft is ready for the secure Question Review workflow.",
    true
  );

}


/* =====================================================
   FORM TYPE
   ===================================================== */

$("type")
  .addEventListener(
    "change",
    toggle
  );


/* =====================================================
   SEARCH
   ===================================================== */

$("search")
  .addEventListener(
    "input",
    render
  );


/* =====================================================
   SAVE ACADEMIC RECORD
   ===================================================== */

$("academicForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      if (
        $("type").value ===
        "Assignment" &&
        (
          !$("className").value ||
          !$("subject").value ||
          !$("teacher").value
        )
      ) {

        $("formMsg")
          .className =
          "msg err";

        $("formMsg")
          .textContent =
          "Select Class, Subject and Teacher.";

        return;

      }


      const body = {

        type:
          $("type").value,

        name:
          $("name")
            .value
            .trim(),

        code:
          $("code")
            .value
            .trim(),

        programme:
          $("programme").value,

        className:
          $("className").value,

        subject:
          $("subject").value,

        teacher:
          $("teacher").value,

        status:
          $("status").value,

        notes:
          $("notes")
            .value
            .trim()

      };


      if (editing) {

        body.airtableId =
          editing.airtableId;

      }


      try {

        const r =
          await fetch(
            "/api/academic",
            {

              method:
                editing
                  ? "PUT"
                  : "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  body
                )

            }
          );


        const d =
          await safeJson(r);


        if (!r.ok) {

          throw new Error(
            d.error?.message ||
            d.error ||
            "Save failed"
          );

        }


        closeForm();

        await loadData();


        show(
          "Academic record saved successfully.",
          true
        );

      }
      catch (x) {

        console.error(
          "ACADEMIC SAVE ERROR:",
          x
        );


        $("formMsg")
          .className =
          "msg err";

        $("formMsg")
          .textContent =
          x.message;

      }

    }
  );


/* =====================================================
   CLOSE MODAL
   ===================================================== */

$("modal")
  .addEventListener(
    "click",
    e => {

      if (
        e.target ===
        $("modal")
      ) {

        closeForm();

      }

    }
  );


/* =====================================================
   INITIALIZE
   ===================================================== */

toggle();

loadData();

</script>
