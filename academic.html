<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08783f">
<title>Aibinu Flexiprep | Academic Management</title>
<style>
:root{--g:#08783f;--gold:#d7a62a;--ink:#17382b;--muted:#68756f;--bg:#f4f7f5;--line:#dfe7e2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}.logo{background:var(--gold);color:var(--g);padding:11px;border-radius:10px;font-weight:800}.brand small{display:block;opacity:.8}
nav{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--gold);color:var(--ink)}.secondary{background:#fff;color:var(--g);border:1px solid var(--line)}
main{max-width:1200px;margin:24px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px}
h1{margin:5px 0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card strong{display:block;font-size:23px;margin-top:7px}
.panel{margin-top:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:var(--g);color:#fff}
.toolbar{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.search{flex:1;min-width:220px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd8d1;border-radius:8px;font:inherit;background:#fff}
.toolbar select{width:auto;min-width:140px}.wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}
.badge{padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#e5f5eb;color:var(--g)}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}
.dialog{background:#fff;padding:20px;border-radius:15px;max-width:700px;width:100%;max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.actions{text-align:right;margin-top:15px}.msg{padding:10px;border-radius:8px;margin:10px 0}.err{background:#fde9e7;color:#b42318}.ok{background:#e5f5eb;color:var(--g)}
label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{display:block}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">AF</div><div><b>AIBINU FLEXIPREP</b><small>EDUCONSULT · ACADEMIC MANAGEMENT</small></div></div>
  <nav>
    <button class="secondary" onclick="location.href='/'">Student Management</button>
    <button class="secondary" onclick="location.href='/finance.html'">Payments</button>
  </nav>
</header>

<main>
  <div class="head">
    <div><small>AIBINU FLEXIPREP</small><h1>Academic Management</h1><div class="muted">Manage programmes, classes, subjects, teachers and class–subject assignments.</div></div>
    <button class="primary" onclick="openForm()">+ Add Record</button>
  </div>

  <div id="msg"></div>

  <div class="cards">
    <div class="card">Programmes<strong id="countProgramme">0</strong></div>
    <div class="card">Classes<strong id="countClass">0</strong></div>
    <div class="card">Subjects<strong id="countSubject">0</strong></div>
    <div class="card">Teachers<strong id="countTeacher">0</strong></div>
    <div class="card">Assignments<strong id="countAssignment">0</strong></div>
  </div>

  <section class="panel">
    <div class="tabs">
      <button class="secondary active" data-type="All">All</button>
      <button class="secondary" data-type="Programme">Programmes</button>
      <button class="secondary" data-type="Class">Classes</button>
      <button class="secondary" data-type="Subject">Subjects</button>
      <button class="secondary" data-type="Teacher">Teachers</button>
      <button class="secondary" data-type="Assignment">Assignments</button>
    </div>

    <div class="toolbar">
      <div class="search"><input id="search" placeholder="Search name, code, programme, class, subject or teacher"></div>
      <button class="secondary" onclick="loadData()">↻ Refresh</button>
    </div>

    <div class="wrap">
      <table>
        <thead><tr><th>Type</th><th>Name</th><th>Code</th><th>Programme</th><th>Class</th><th>Subject</th><th>Teacher</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="modal" class="modal">
  <div class="dialog">
    <h2 id="formTitle">Add Academic Record</h2>
    <div id="formMsg"></div>
    <form id="academicForm">
      <div class="grid">
        <div>
          <label>Record Type</label>
          <select id="type" required>
            <option value="Programme">Programme</option>
            <option value="Class">Class</option>
            <option value="Subject">Subject</option>
            <option value="Teacher">Teacher</option>
            <option value="Assignment">Assignment</option>
          </select>
        </div>
        <div><label>Name</label><input id="name" required placeholder="e.g. WAEC / NECO"></div>
        <div><label>Code</label><input id="code" placeholder="e.g. WAEC"></div>
        <div><label>Programme</label><input id="programme" placeholder="e.g. WAEC / NECO"></div>
        <div><label>Class</label><input id="className" placeholder="e.g. SS2 Science"></div>
        <div><label>Subject</label><input id="subject" placeholder="e.g. Physics"></div>
        <div><label>Teacher</label><input id="teacher" placeholder="e.g. Mr Aibinu"></div>
        <div>
          <label>Status</label>
          <select id="status"><option>Active</option><option>Inactive</option></select>
        </div>
        <div class="full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div>
      </div>
      <div class="actions">
        <button type="button" class="secondary" onclick="closeForm()">Cancel</button>
        <button class="primary">Save Record</button>
      </div>
    </form>
  </div>
</div>

<script>
let records=[],currentType="All",editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.error?.message||d.error||'Request failed');return d}
async function loadData(){
  try{const d=await get('/api/academic');records=d.records||[];render();show('',true)}
  catch(e){show(e.message,false)}
}
function render(){
  const types=['Programme','Class','Subject','Teacher','Assignment'];
  types.forEach(t=>document.getElementById('count'+t).textContent=records.filter(x=>x.type===t).length);
  const q=document.getElementById('search').value.toLowerCase().trim();
  const data=records.filter(x=>{
    const text=`${x.type} ${x.name} ${x.code} ${x.programme} ${x.className} ${x.subject} ${x.teacher}`.toLowerCase();
    return (currentType==='All'||x.type===currentType)&&(!q||text.includes(q));
  });
  document.getElementById('rows').innerHTML=data.map(x=>`
    <tr>
      <td>${esc(x.type)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.code)}</td>
      <td>${esc(x.programme)}</td><td>${esc(x.className)}</td><td>${esc(x.subject)}</td>
      <td>${esc(x.teacher)}</td><td><span class="badge">${esc(x.status)}</span></td>
      <td><button class="secondary" onclick="editRecord('${esc(x.airtableId)}')">Edit</button></td>
    </tr>`).join('')||'<tr><td colspan="9">No academic records found.</td></tr>';
}
function openForm(record=null){
  editing=record;
  document.getElementById('formTitle').textContent=record?'Edit Academic Record':'Add Academic Record';
  ['type','name','code','programme','className','subject','teacher','status','notes'].forEach(id=>{
    const el=document.getElementById(id);
    el.value=record?record[id]||'':(id==='status'?'Active':'');
  });
  document.getElementById('modal').classList.add('show');
}
function closeForm(){document.getElementById('modal').classList.remove('show');document.getElementById('academicForm').reset();editing=null}
function editRecord(id){const r=records.find(x=>x.airtableId===id);if(r)openForm(r)}
function show(text,ok){const m=document.getElementById('msg');m.className=text?'msg '+(ok?'ok':'err'):'msg';m.textContent=text}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{currentType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
document.getElementById('search').oninput=render;
document.getElementById('academicForm').onsubmit=async e=>{
  e.preventDefault();
  const body={type:type.value,name:name.value,code:code.value,programme:programme.value,className:className.value,subject:subject.value,teacher:teacher.value,status:status.value,notes:notes.value};
  if(editing)body.airtableId=editing.airtableId;
  try{
    const r=await fetch('/api/academic',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();if(!r.ok)throw Error(d.error?.message||d.error||'Save failed');
    closeForm();show('Academic record saved successfully.',true);await loadData();
  }catch(x){document.getElementById('formMsg').className='msg err';document.getElementById('formMsg').textContent=x.message}
};
loadData();
</script>
</body>
</html>
