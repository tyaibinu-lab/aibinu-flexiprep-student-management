<script>
"use strict";

/* =========================================================
   AIBINU FLEXIPREP
   ACADEMIC MANAGEMENT FRONTEND
   ========================================================= */

let records = [];
let currentType = "All";
let editing = null;

let currentAIType = null;
let currentAIPayload = null;
let currentAIResult = null;


/* =========================================================
   BASIC HELPERS
   ========================================================= */

const $ = id => document.getElementById(id);

const esc = s =>
  String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));


async function safeJson(r) {
  const type = r.headers.get("content-type") || "";
  const text = await r.text();

  if (type.toLowerCase().includes("application/json")) {
    try {
      return text ? JSON.parse(text) : {};
    } catch (e) {
      throw new Error("Server returned invalid JSON.");
    }
  }

  if (!text) {
    throw new Error(
      `Server returned an empty response (${r.status}).`
    );
  }

  throw new Error(text.slice(0, 1200));
}


function errMsg(d, fallback) {
  return typeof d?.error === "string"
    ? d.error
    : d?.error?.message || d?.message || fallback;
}


function show(message, ok) {
  const e = $("msg");

  if (!e) return;

  e.className = message
    ? "msg " + (ok ? "ok" : "err")
    : "msg";

  e.textContent = message || "";
}


/* =========================================================
   RECORD CLEANING
   ========================================================= */

function cleanRecords(data) {
  return (Array.isArray(data) ? data : [])
    .filter(r => {
      if (!r || !r.type) return false;

      /*
       * Assignments need Class + Subject + Teacher.
       * Other records need a name.
       */
      if (r.type === "Assignment") {
        return Boolean(
          r.className &&
          r.subject &&
          r.teacher
        );
      }

      return String(r.name || "").trim();
    });
}


function displayName(r) {
  if (r.type === "Assignment") {
    return [
      r.className,
      r.subject,
      r.teacher
    ]
      .filter(Boolean)
      .join(" — ");
  }

  return r.name || "";
}


/* =========================================================
   UNIQUE ACTIVE RECORDS
   ========================================================= */

function unique(type) {
  const seen = new Set();

  return records
    .filter(r =>
      r.type === type &&
      r.status !== "Inactive" &&
      String(r.name || "").trim()
    )
    .filter(r => {
      const key = r.name.trim().toLowerCase();

      if (seen.has(key)) return false;

      seen.add(key);
      return true;
    })
    .sort((a, b) =>
      String(a.name).localeCompare(String(b.name))
    );
}


/* =========================================================
   DROPDOWN POPULATION
   ========================================================= */

function fill(id, type, placeholder) {
  const e = $(id);

  if (!e) return;

  const list = unique(type);

  e.innerHTML =
    "<option value=''>" +
    placeholder +
    "</option>" +
    list
      .map(r =>
        `<option value="${esc(r.name)}">${esc(r.name)}</option>`
      )
      .join("");
}


function populate() {
  /*
   * Programme is virtual and supplied by the backend.
   * Classes, Subjects and Teachers come from Airtable.
   */
  fill(
    "programme",
    "Programme",
    "Select programme"
  );

  fill(
    "className",
    "Class",
    "Select class"
  );

  fill(
    "subject",
    "Subject",
    "Select subject"
  );

  fill(
    "teacher",
    "Teacher",
    "Select teacher"
  );
}


/* =========================================================
   NOTEBANK STATISTICS
   ========================================================= */

async function loadNoteBankStats() {
  try {
    const r = await fetch(
      "/api/academic?stats=1",
      { cache: "no-store" }
    );

    const d = await safeJson(r);

    if (!r.ok || d.success !== true) {
      throw new Error(
        errMsg(
          d,
          "Unable to load NoteBank statistics."
        )
      );
    }

    $("nbDraftNotes").textContent =
      Number(
        d.draftContent ??
        d.draftNotes ??
        0
      );

    $("nbPending").textContent =
      Number(d.pendingReview ?? 0);

    $("nbPublished").textContent =
      Number(d.published ?? 0);

    $("nbAIJobs").textContent =
      Number(d.aiJobs ?? 0);

  } catch (e) {
    console.error(
      "NoteBank statistics error:",
      e
    );
  }
}


/* =========================================================
   LOAD ACADEMIC DATA
   ========================================================= */

async function loadData() {
  try {
    const r = await fetch(
      "/api/academic",
      { cache: "no-store" }
    );

    const d = await safeJson(r);

    if (!r.ok) {
      throw new Error(
        errMsg(
          d,
          "Unable to load records."
        )
      );
    }

    records = cleanRecords(
      d.records || []
    );

    populate();
    render();

    await loadNoteBankStats();

    show("", true);

  } catch (e) {
    console.error(e);

    show(
      e.message ||
      "Unable to load academic records.",
      false
    );
  }
}


/* =========================================================
   SEARCH
   ========================================================= */

function matchesSearch(r, q) {
  if (!q) return true;

  return `
    ${r.type || ""}
    ${r.name || ""}
    ${r.code || ""}
    ${r.programme || ""}
    ${r.className || ""}
    ${r.subject || ""}
    ${r.teacher || ""}
    ${r.status || ""}
  `
    .toLowerCase()
    .includes(q);
}


/* =========================================================
   RENDER ACADEMIC RECORDS
   ========================================================= */

function render() {

  [
    "Programme",
    "Class",
    "Subject",
    "Teacher",
    "Assignment"
  ].forEach(type => {

    const e = $("count" + type);

    if (e) {
      e.textContent =
        records.filter(
          r => r.type === type
        ).length;
    }
  });


  /*
   * When NoteBank is selected,
   * Academic records are hidden.
   */
  if (currentType === "NoteBank") {
    return;
  }


  const q =
    $("search").value
      .toLowerCase()
      .trim();


  const data =
    records.filter(r =>
      (
        currentType === "All" ||
        r.type === currentType
      ) &&
      matchesSearch(r, q)
    );


  /* -------------------------
     DESKTOP TABLE
     ------------------------- */

  $("rows").innerHTML =
    data.map(r => {

      const id =
        String(r.airtableId || "");

      return `
        <tr>
          <td>${esc(r.type)}</td>

          <td>
            <b>${esc(displayName(r))}</b>
          </td>

          <td>${esc(r.code)}</td>

          <td>${esc(r.programme)}</td>

          <td>${esc(r.className)}</td>

          <td>${esc(r.subject)}</td>

          <td>${esc(r.teacher)}</td>

          <td>
            <span class="badge">
              ${esc(r.status || "Active")}
            </span>
          </td>

          <td>
            ${
              r.type === "Programme"
                ? ""
                : `
                  <button
                    type="button"
                    class="secondary"
                    onclick="editRecord('${esc(id)}')">
                    Edit
                  </button>
                `
            }
          </td>
        </tr>
      `;
    }).join("")
    ||
    `
      <tr>
        <td colspan="9">
          No academic records found.
        </td>
      </tr>
    `;


  /* -------------------------
     MOBILE RECORDS
     ------------------------- */

  $("mobileRecords").innerHTML =
    data.map(r => {

      const id =
        String(r.airtableId || "");

      return `
        <div class="record-card">

          <div class="record-title">
            ${esc(displayName(r))}
          </div>

          <div class="record-grid">

            <div class="record-field">
              <small>Type</small>
              <div>${esc(r.type)}</div>
            </div>

            <div class="record-field">
              <small>Code</small>
              <div>${esc(r.code)}</div>
            </div>

            <div class="record-field">
              <small>Programme</small>
              <div>${esc(r.programme)}</div>
            </div>

            <div class="record-field">
              <small>Class</small>
              <div>${esc(r.className)}</div>
            </div>

            <div class="record-field">
              <small>Subject</small>
              <div>${esc(r.subject)}</div>
            </div>

            <div class="record-field">
              <small>Teacher</small>
              <div>${esc(r.teacher)}</div>
            </div>

            <div class="record-field">
              <small>Status</small>
              <div>${esc(r.status || "Active")}</div>
            </div>

          </div>

          ${
            r.type === "Programme"
              ? ""
              : `
                <div class="record-action">
                  <button
                    type="button"
                    class="secondary"
                    onclick="editRecord('${esc(id)}')">
                    Edit
                  </button>
                </div>
              `
          }

        </div>
      `;
    }).join("");
}


/* =========================================================
   FORM DISPLAY LOGIC
   ========================================================= */

function toggle() {

  const type =
    $("type").value;

  const assignment =
    type === "Assignment";

  const programme =
    type === "Programme";

  const subject =
    type === "Subject";


  /*
   * Programme is NOT an Airtable CRUD record.
   * It is a controlled virtual list.
   */
  $("nameWrap").style.display =
    assignment ? "none" : "block";


  $("codeWrap").style.display =
    (programme || subject)
      ? "block"
      : "none";


  [
    "programmeWrap",
    "classWrap",
    "subjectWrap",
    "teacherWrap"
  ].forEach(id => {

    $(id).style.display =
      assignment
        ? "block"
        : "none";
  });


  $("name").required =
    !assignment;


  $("className").required =
    assignment;


  $("subject").required =
    assignment;


  $("teacher").required =
    assignment;


  $("nameLabel").textContent =
    programme
      ? "Programme"
      : type;
}


/* =========================================================
   OPEN FORM
   ========================================================= */

function openForm(r = null) {

  editing = r;

  $("formTitle").textContent =
    r
      ? "Edit Academic Record"
      : "Add Academic Record";


  $("academicForm").reset();

  $("formMsg").textContent = "";

  $("formMsg").className = "";


  if (r) {

    $("type").value =
      r.type;

    $("name").value =
      r.name || "";

    $("code").value =
      r.code || "";

    $("programme").value =
      r.programme || "";

    $("className").value =
      r.className || "";

    $("subject").value =
      r.subject || "";

    $("teacher").value =
      r.teacher || "";

    $("status").value =
      r.status || "Active";

    $("notes").value =
      r.notes || "";

  } else {

    /*
     * IMPORTANT:
     * New records should NOT default to Programme.
     * WAEC / NECO / UTME are controlled virtual values.
     *
     * Default to Class because that is the most common
     * academic-management record being created.
     */
    $("type").value = "Class";
  }


  toggle();

  $("modal")
    .classList
    .add("show");
}


function closeForm() {

  $("modal")
    .classList
    .remove("show");

  editing = null;
}


function editRecord(id) {

  const r =
    records.find(
      x => x.airtableId === id
    );

  if (!r) return;


  /*
   * Virtual Programme records cannot
   * be edited through Airtable CRUD.
   */
  if (r.type === "Programme") {

    show(
      "Programmes are controlled values: WAEC, NECO and UTME.",
      false
    );

    return;
  }


  openForm(r);
}


/* =========================================================
   ACADEMIC TABS
   ========================================================= */

$("tabs").addEventListener(
  "click",
  e => {

    const b =
      e.target.closest(
        "[data-type]"
      );

    if (!b) return;


    currentType =
      b.dataset.type;


    document
      .querySelectorAll(
        "#tabs [data-type]"
      )
      .forEach(x =>
        x.classList.remove("active")
      );


    b.classList.add("active");


    const nb =
      currentType === "NoteBank";


    $("academicRecords")
      .style.display =
        nb ? "none" : "block";


    $("noteBank")
      .classList
      .toggle("active", nb);


    if (nb) {
      loadNoteBankStats();
    } else {
      render();
    }
  }
);


/* =========================================================
   AI TOOL TABS
   ========================================================= */

function showAITool(t) {

  $("noteCreator")
    .classList
    .toggle(
      "active",
      t === "note"
    );


  $("questionCreator")
    .classList
    .toggle(
      "active",
      t === "question"
    );


  $("noteCreatorTab")
    .classList
    .toggle(
      "active",
      t === "note"
    );


  $("questionCreatorTab")
    .classList
    .toggle(
      "active",
      t === "question"
    );
}


/* =========================================================
   EXAMINATION CHECKBOXES
   ========================================================= */

function exams(cls) {

  return [
    ...document.querySelectorAll(
      "." + cls + ":checked"
    )
  ]
    .map(x => x.value)
    .filter(Boolean);
}


/* =========================================================
   BUILD NOTE PROMPT
   ========================================================= */

function buildNotePrompt() {

  const subject =
    $("aiNoteSubject")
      .value
      .trim();

  const cls =
    $("aiNoteClass")
      .value
      .trim();

  const programme =
    $("aiNoteProgramme")
      .value
      .trim();

  const topic =
    $("aiNoteTopic")
      .value
      .trim();

  const teacherPrompt =
    $("aiNotePrompt")
      .value
      .trim();

  const e =
    exams("noteExam");


  if (
    !subject ||
    !cls ||
    !topic ||
    !teacherPrompt
  ) {
    throw new Error(
      "Select Subject, Class, Topic and enter the teacher prompt."
    );
  }


  const examinationFocus =
    e.length
      ? e
      : ["WAEC", "NECO", "UTME"];


  return {

    contentType: "Note",

    subject,

    className: cls,

    programme,

    topic,

    examTypes:
      examinationFocus,

    teacherPrompt,

    systemContext:
`Create academic content for Aibinu Flexiprep Educonsult.

Subject: ${subject}.
Class: ${cls}.
Programme: ${programme || "General"}.
Topic: ${topic}.
Examination focus: ${examinationFocus.join(", ")}.

The teacher's prompt is the primary instruction.

Return a teacher-review draft.

Do not publish.`
  };
}


/* =========================================================
   BUILD QUESTION PROMPT
   ========================================================= */

function buildQuestionPrompt() {

  const subject =
    $("aiQuestionSubject")
      .value
      .trim();

  const cls =
    $("aiQuestionClass")
      .value
      .trim();

  const programme =
    $("aiQuestionProgramme")
      .value
      .trim();

  const topic =
    $("aiQuestionTopic")
      .value
      .trim();

  const count =
    Math.max(
      1,
      Math.min(
        100,
        Number(
          $("aiQuestionCount")
            .value || 1
        )
      )
    );

  const difficulty =
    $("aiQuestionDifficulty")
      .value;

  const bloomLevel =
    $("aiQuestionBloom")
      .value;

  const questionType =
    $("aiQuestionType")
      .value;

  const teacherPrompt =
    $("aiQuestionPrompt")
      .value
      .trim();

  const e =
    exams("questionExam");


  if (
    !subject ||
    !cls ||
    !topic ||
    !teacherPrompt
  ) {
    throw new Error(
      "Select Subject, Class, Topic and enter the teacher prompt."
    );
  }


  const examinationFocus =
    e.length
      ? e
      : ["WAEC", "NECO", "UTME"];


  return {

    contentType: "Question",

    subject,

    className: cls,

    programme,

    topic,

    examTypes:
      examinationFocus,

    questionCount:
      count,

    difficulty,

    bloomLevel,

    questionType,

    teacherPrompt,

    systemContext:
`Create examination-style questions for Aibinu Flexiprep Educonsult.

Subject: ${subject}.
Class: ${cls}.
Programme: ${programme || "General"}.
Topic: ${topic}.
Number: ${count}.
Difficulty: ${difficulty}.
Bloom: ${bloomLevel}.
Type: ${questionType}.

Return questions for teacher review.

Do not approve or publish.`
  };
}


/* =========================================================
   NOTEBANK NORMALISATION
   ========================================================= */

function noteKey(n) {

  return (
    n?.["Note ID"] ||
    n?.noteId ||
    n?.airtableId ||
    n?.id ||

    currentAIResult?.raw?.note?.["Note ID"] ||
    currentAIResult?.raw?.note?.noteId ||
    currentAIResult?.raw?.note?.airtableId ||
    currentAIResult?.raw?.note?.id ||

    null
  );
}


function noteNorm(n) {

  return {

    title:
      n?.title ??
      n?.Title ??
      "",

    learningObjectives:
      n?.learningObjectives ??
      n?.["Learning Objectives"] ??
      "",

    keyTerms:
      n?.keyTerms ??
      n?.["Key Terms"] ??
      "",

    content:
      n?.content ??
      n?.Content ??
      "",

    examples:
      n?.examples ??
      n?.Examples ??
      "",

    workedExamples:
      n?.workedExamples ??
      n?.["Worked Examples"] ??
      "",

    formulae:
      n?.formulae ??
      n?.Formulae ??
      "",

    applications:
      n?.applications ??
      n?.Applications ??
      "",

    commonMisconceptions:
      n?.commonMisconceptions ??
      n?.["Common Misconceptions"] ??
      "",

    summary:
      n?.summary ??
      n?.Summary ??
      "",

    examTips:
      n?.examTips ??
      n?.["Exam Tips"] ??
      "",

    waecFocus:
      n?.waecFocus ??
      n?.["WAEC Focus"] ??
      "",

    necoFocus:
      n?.necoFocus ??
      n?.["NECO Focus"] ??
      "",

    utmeFocus:
      n?.utmeFocus ??
      n?.["UTME Focus"] ??
      "",

    diagrams:
      n?.diagrams ??
      n?.Diagrams ??
      ""
  };
}


/* =========================================================
   RENDER NOTE
   ========================================================= */

function renderNote(n) {

  const x =
    noteNorm(n);


  $("notePromptPreview").textContent =
`📚 AIBINU FLEXIPREP NOTEBANK

STATUS: ${n.status || "AI Draft"}

TITLE
${x.title}

LEARNING OBJECTIVES
${x.learningObjectives}

KEY TERMS
${x.keyTerms}

CONTENT
${x.content}

EXAMPLES
${x.examples}

WORKED EXAMPLES
${x.workedExamples}

FORMULAE
${x.formulae}

APPLICATIONS
${x.applications}

COMMON MISCONCEPTIONS
${x.commonMisconceptions}

SUMMARY
${x.summary}

EXAMINATION TIPS
${x.examTips}

WAEC FOCUS
${x.waecFocus}

NECO FOCUS
${x.necoFocus}

UTME FOCUS
${x.utmeFocus}

}


/* =========================================================
   BUTTON LOADING
   ========================================================= */

function loading(id, text) {

  const b = $(id);

  if (!b) return null;

  b.disabled = true;

  if (!b.dataset.old) {
    b.dataset.old =
      b.textContent;
  }

  b.textContent = text;

  return b;
}


function restore(b, text) {

  if (!b) return;

  b.disabled = false;

  b.textContent =
    b.dataset.old || text;

  delete b.dataset.old;
}


/* =========================================================
   GENERATE NOTE
   ========================================================= */

async function generateNoteDraft() {

  let p;

  try {
    p = buildNotePrompt();
  } catch (e) {

    show(
      e.message,
      false
    );

    alert(e.message);

    return;
  }


  currentAIType =
    "note";

  currentAIPayload =
    p;


  const box =
    $("noteAIResult");

  const preview =
    $("notePromptPreview");

  const status =
    box.querySelector(
      ".ai-status"
    );


  const btn =
    loading(
      "generateNoteBtn",
      "⏳ Generating Note..."
    );


  box.classList.add("show");


  preview.textContent =
    "⏳ Generating your NoteBank draft with AI...";


  status.innerHTML =
    "⏳ Generating AI note draft...";


  try {

    const r =
      await fetch(
        "/api/ai-content",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(p)
        }
      );


    const d =
      await safeJson(r);


    if (!r.ok) {
      throw new Error(
        errMsg(
          d,
          `Server error: ${r.status}`
        )
      );
    }


    if (d.success !== true) {
      throw new Error(
        errMsg(
          d,
          "AI note generation failed."
        )
      );
    }


    if (!d.note) {
      throw new Error(
        "The AI returned no note."
      );
    }


    currentAIResult = {
      type: "Note",
      note: d.note,
      raw: d
    };


    renderNote(d.note);


    status.innerHTML =
      "✅ AI note generated successfully. The content is currently a <b>DRAFT</b> and has not been published.";


    show(
      "AI note generated successfully as DRAFT. Review it before submitting for approval.",
      true
    );


    alert(
      "AI note generated successfully as DRAFT."
    );

  } catch (e) {

    console.error(e);

    status.innerHTML =
      "❌ Note generation failed. The draft was not created.";

    preview.textContent =
      "❌ NOTE GENERATION FAILED\n\n" +
      e.message;

    show(
      e.message,
      false
    );

    alert(
      "Note generation failed:\n\n" +
      e.message
    );

  } finally {

    restore(
      btn,
      "✨ Generate Note Draft"
    );
  }
}


/* =========================================================
   GENERATE QUESTIONS
   ========================================================= */

async function generateQuestionDraft() {

  let p;

  try {
    p =
      buildQuestionPrompt();

  } catch (e) {

    show(
      e.message,
      false
    );

    alert(e.message);

    return;
  }


  currentAIType =
    "question";

  currentAIPayload =
    p;


  const box =
    $("questionAIResult");

  const preview =
    $("questionPromptPreview");

  const status =
    box.querySelector(
      ".ai-status"
    );


  const btn =
    loading(
      "generateQuestionBtn",
      "⏳ Generating Questions..."
    );


  box.classList.add("show");


  preview.textContent =
    "⏳ Generating questions with AI...";


  try {

    const r =
      await fetch(
        "/api/ai-content",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(p)
        }
      );


    const d =
      await safeJson(r);


    if (!r.ok) {
      throw new Error(
        errMsg(
          d,
          `Server error: ${r.status}`
        )
      );
    }


    if (d.success !== true) {
      throw new Error(
        errMsg(
          d,
          "AI question generation failed."
        )
      );
    }


    const qs =
      Array.isArray(d.questions)
        ? d.questions
        : [];


    if (!qs.length) {
      throw new Error(
        "The AI returned no questions."
      );
    }


    currentAIResult = {
      type: "Question",
      questions: qs,
      raw: d
    };


    preview.textContent =
      qs.map(
        (q, i) =>
`QUESTION ${i + 1}

${q.question || ""}

A. ${q.optionA || ""}
B. ${q.optionB || ""}
C. ${q.optionC || ""}
D. ${q.optionD || ""}

Correct Answer: ${q.correctAnswer || ""}

Difficulty: ${q.difficulty || ""}

Bloom Level: ${q.bloomLevel || ""}

Explanation:
${q.explanation || ""}

${"─".repeat(50)}
`
      ).join("");


    status.innerHTML =
      `✅ ${qs.length} question${qs.length === 1 ? "" : "s"} generated successfully as <b>DRAFT</b>.`;


    show(
      `${qs.length} AI questions generated successfully as DRAFT.`,
      true
    );


    alert(
      `${qs.length} AI questions generated successfully as DRAFT.`
    );

  } catch (e) {

    console.error(e);

    status.innerHTML =
      "❌ Question generation failed.";

    preview.textContent =
      "❌ Generation failed:\n\n" +
      e.message;

    show(
      e.message,
      false
    );

    alert(
      "Question generation failed:\n\n" +
      e.message
    );

  } finally {

    restore(
      btn,
      "✨ Generate Question Draft"
    );
  }
}

/* =========================================================
   SAVE NOTE DRAFT
   ========================================================= */

async function saveNoteDraft() {

  if (!currentAIResult?.note) {

    show(
      "No note draft is currently available.",
      false
    );

    return;
  }


  const id =
    noteKey(
      currentAIResult.note
    );


  if (!id) {

    show(
      "The Note ID could not be found. Generate the note again.",
      false
    );

    return;
  }


  const n =
    collectEditedNote();


  if (!n.title) {

    show(
      "Note title is required.",
      false
    );

    return;
  }


  try {

    const r =
      await fetch(
        "/api/note-reviews",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              saveBody(id, n)
            )
        }
      );


    const d =
      await safeJson(r);


    if (!r.ok) {

      throw new Error(
        errMsg(
          d,
          "Unable to save note."
        )
      );
    }


    currentAIResult.note = {
      ...currentAIResult.note,
      ...n
    };


    renderNote(
      currentAIResult.note
    );


    show(
      "Note draft saved successfully.",
      true
    );


    await loadNoteBankStats();


    alert(
      "Note draft saved successfully."
    );

  } catch (e) {

    console.error(e);

    show(
      e.message,
      false
    );

    alert(
      "Save failed:\n\n" +
      e.message
    );
  }
}

async function saveAndSubmitNote() {

  if (!currentAIResult?.note) {

    show(
      "Generate a note draft first.",
      false
    );

    return;
  }


  /*
   * FIXED:
   *
   * Old broken code:
   *
   * const id=...

   */
  const id =
    noteKey(
      currentAIResult.note
    );


  if (!id) {

    show(
      "The Note ID could not be found.",

    );

    return;
  }


  const n =
    collectEditedNote();


  if (!n.title) {

    show(
      "Note title is required.",
      false
    );

    return;
  }


  try {

    /* -------------------------
       SAVE

    let r =
      await fetch(

          headers: {

          },

            JSON.stringify(

        }
      );

    if (!r.ok) {

        errMsg(

        )
      );
    }


    /* -------------------------

/* =========================================================
   ACADEMIC FORM SUBMISSION
   ========================================================= */

$("academicForm").addEventListener(
  "submit",
  async e => {

    e.preventDefault();


    const type =
      $("type").value;


    /*
     * PROGRAMME IS VIRTUAL
     *
     * WAEC / NECO / UTME are controlled
     * programme values, not Airtable CRUD records.
     */
    if (type === "Programme") {

      $("formMsg").className =
        "msg err";

      $("formMsg").textContent =
        "Programmes are controlled values (WAEC, NECO and UTME) and cannot be created or edited here.";

      return;
    }


    /*
     * ASSIGNMENT VALIDATION
     */
    if (
      type === "Assignment" &&
      (
        !$("className").value ||
        !$("subject").value ||
        !$("teacher").value
      )
    ) {

      $("formMsg").className =
        "msg err";

      $("formMsg").textContent =
        "Select Class, Subject and Teacher.";

      return;
    }


    /*
     * COMMON BODY
     */
    const body = {

      type,

      name:
        $("name").value.trim(),

      code:
        $("code").value.trim(),

      /*
       * Programme belongs to Assignment.
       *
       * For Classes, the backend preserves
       * existing Programme metadata.
       */
      programme:
        type === "Assignment"
          ? $("programme").value
          : "",

      className:
        type === "Assignment"
          ? $("className").value
          : "",

      subject:
        type === "Assignment"
          ? $("subject").value
          : "",

      teacher:
        type === "Assignment"
          ? $("teacher").value
          : "",

      status:
        $("status").value,

      notes:
        $("notes").value.trim()
    };


    /*
     * EDIT
     */
    if (editing) {

      body.airtableId =
        editing.airtableId;
    }


    try {

      const r =
        await fetch(
          "/api/academic",
          {
            method:
              editing
                ? "PUT"
                : "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(body)
          }
        );


      const d =
        await safeJson(r);


      if (!r.ok) {

        throw new Error(
          errMsg(
            d,
            "Save failed."
          )
        );
      }


      closeForm();


      await loadData();


      show(
        "Academic record saved successfully.",
        true
      );

    } catch (x) {

      console.error(x);

      $("formMsg").className =
        "msg err";

      $("formMsg").textContent =
        x.message ||
        "Save failed.";
    }
  }
);
